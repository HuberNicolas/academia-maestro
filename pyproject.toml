[project]
name = "academia-maestro"
version = "0.2.0"
description = "Ask ChatPDF the same questions about many research papers and save the answers as JSON"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Nicolas Huber", email = "nicolas.huber.dev@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
academia-maestro = "academia_maestro.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# pycodestyle errors, Pyflakes, import sorting, pyupgrade, bugbear
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
